competition: umud-challenge-muscle-architecture-in-ultrasound-data
targets:
  columns:
  - pa_deg
  - fl_mm
  - mt_mm
  equal_weights: true
scorer:
  organizer: paulritsche
  notebook: umud-score
  version_pinned: 9
  pull_url: https://www.kaggle.com/api/v1/kernels/pull/paulritsche/umud-score
  notebook_source_sha256: 3873f613d55be3eee82229d661dd2c06c1d3c962ff63a1ec45b0a97b29cf061f
  tolerances:
    pa_deg: 6.0
    fl_mm: 12.0
    mt_mm: 3.0
  composition:
    s2_coeff: 1.0e-06
    s3_coeff: 1.0e-09
failure_accounting:
  policy: include_failures_in_validation
  near_parallel_intersection: reject_or_flag
  missing_prediction: counts_as_failure
  note: 'Bounding/clipping an estimator is a separate policy decision, not a theorem
    about intersection geometry.

    '
split_rules:
  unit: content_group
  cross_task_exclusion: true
  require_shared_split_for_baseline_and_candidate: true
  subject_ids_when_unavailable: 'Document that duplicate-aware validation does not
    establish subject independence.

    '
model_selection:
  rule: PLACEHOLDER_fill_after_tier_b_held_out_evidence
  primary_metric: official_S_with_pinned_scorer
  require_paired_group_comparisons: true
  disallow_image_bootstrap_as_independent_subjects: true
supervision:
  missing_label_is_not_background: true
  sparse_fascicle_unmarked_pixels_not_auto_negatives: true
geometry:
  pennation_reference: physical_deep_aponeurosis_tangent
  physical_spacing: anisotropic_diag_sx_sy
  map_predictions_back_through_full_inverse_transform: true
eval_tiers:
  tier_a: component_diagnostics
  tier_b: independent_pa_fl_mt_with_pinned_scorer
attention_candidate:
  config: configs/model_anatomy_query.yaml
  default_ablation_enablement: all_attention_off
  ablation_order:
  - enable_image_self_attn
  - enable_cross_attn
  - enable_query_self_attn
  geometry_outside_model: true
  blocked_until_baseline_tier_b: true
phase2_audit:
  status: not_run
  note: "Populate by running scripts/audits/run_phase2.sh --data-root <umud>. Does\
    \ not invent competition scores; reports_written \u2260 phase2 passed."
